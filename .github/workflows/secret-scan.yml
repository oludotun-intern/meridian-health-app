# .github/workflows/secret-scan.yml
name: Secret Scan + CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

    # ── Job 1: secret scanning (runs first) ──────────────────
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so TruffleHog can diff

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

    # ── Job 2: build (only runs if scan passes) ──────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: trufflehog  # ← blocked until scan succeeds
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Build step runs here"
