# .github/workflows/secret-scan.yml
name: Secret Scan + CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

            # ── PR scan: diff between base branch and this branch ──
      - name: TruffleHog — PR diff scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

            # ── Push scan: filesystem scan (no diff needed) ────────
      - name: TruffleHog — push filesystem scan
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
                    # no base/head = filesystem scan of entire working tree

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: trufflehog
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Build step runs here"
